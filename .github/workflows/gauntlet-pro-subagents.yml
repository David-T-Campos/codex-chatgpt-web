name: Gauntlet Pro native subagents

on:
  push:
    branches:
      - parity/pro-native-subagents-work

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parity/pro-native-subagents-work
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Remove Pro-only delegation suppression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          prompt = Path('src/adapters/chatgpt-web/prompt.ts')
          text = prompt.read_text()
          block = '''  const proDelegationContract = !parsed._compactionRequest && mode.effort === "max"
            ? [
              "Complete this task directly in the current parent response. Do not create, spawn, delegate to, or wait on sub-agents, parallel agents, background agents, or delegated workers, even if such tools are available. Use non-agent tools directly instead.",
            ]
            : [];
          '''
          assert text.count(block) == 1, 'Pro delegation contract changed upstream'
          text = text.replace(block, '')
          assert text.count('          ...proDelegationContract,\n') == 1, 'multipart Pro spread changed upstream'
          text = text.replace('          ...proDelegationContract,\n', '')
          assert text.count('      ...proDelegationContract,\n') == 1, 'inline Pro spread changed upstream'
          text = text.replace('      ...proDelegationContract,\n', '')
          prompt.write_text(text)

          tests = Path('tests/prompt-contract.test.ts')
          text = tests.read_text()
          old = '''test("Pro executes directly without delegating while other Web modes keep their existing contract", () => {
            const token = "turn_12345678901234567890123456789012";
            const capabilities = { localToolsEnabled: true, solAvailable: true, proAvailable: true };
            const pro = compileChatGptWebPrompt(request("max"), capabilities, token);
            const extraHigh = compileChatGptWebPrompt(request("xhigh"), capabilities, token);

            expect(pro.text).toContain("Complete this task directly in the current parent response.");
            expect(pro.text).toContain("Do not create, spawn, delegate to, or wait on sub-agents");
            expect(pro.text).toContain("Use non-agent tools directly instead.");
            expect(extraHigh.text).not.toContain("Do not create, spawn, delegate to, or wait on sub-agents");
          });
          '''
          new = '''test("Pro preserves the same native Codex delegation contract as Extra High", () => {
            const token = "turn_12345678901234567890123456789012";
            const capabilities = { localToolsEnabled: true, solAvailable: true, proAvailable: true };
            const pro = compileChatGptWebPrompt(request("max"), capabilities, token);
            const extraHigh = compileChatGptWebPrompt(request("xhigh"), capabilities, token);

            for (const compiled of [pro, extraHigh]) {
              expect(compiled.text).toContain("For local work required by the task, use the attached Codex Native tools directly according to their declared descriptions and schemas.");
              expect(compiled.text).toContain(`Pass turn_token ${token} unchanged to every Codex Native call in this response`);
              expect(compiled.text).not.toContain("Complete this task directly in the current parent response.");
              expect(compiled.text).not.toContain("Do not create, spawn, delegate to, or wait on sub-agents");
              expect(compiled.text).not.toContain("Use non-agent tools directly instead.");
            }
          });
          '''
          assert text.count(old) == 1, 'Pro prompt regression test changed upstream'
          tests.write_text(text.replace(old, new))
          PY
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install launcher dependencies
        working-directory: launcher
        run: bun install --frozen-lockfile
      - name: Targeted native-agent tests
        run: bun test tests/prompt-contract.test.ts tests/server-subagents.test.ts tests/chatgpt-web-harness.test.ts
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Full verification
        run: bun run verify
      - name: Commit verified parity fix
        shell: bash
        run: |
          rm .github/workflows/gauntlet-pro-subagents.yml
          git config user.name "David-T-Campos"
          git config user.email "132998405+David-T-Campos@users.noreply.github.com"
          git add src/adapters/chatgpt-web/prompt.ts tests/prompt-contract.test.ts .github/workflows/gauntlet-pro-subagents.yml
          git commit -m "fix: preserve native subagent delegation for Pro"
          git push origin parity/pro-native-subagents-work
