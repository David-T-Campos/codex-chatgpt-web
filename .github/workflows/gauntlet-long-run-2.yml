name: Gauntlet long-run parity verify

on:
  push:
    branches:
      - parity/long-run-continuation

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parity/long-run-continuation
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Reuse staged browser-worker patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/gauntlet-long-run.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n'
          Path('/tmp/gauntlet_patch.py').write_text(script)
          PY
          python3 /tmp/gauntlet_patch.py
      - name: Install runtime dependencies
        run: bun install --frozen-lockfile
      - name: Install launcher dependencies
        working-directory: launcher
        run: bun install --frozen-lockfile
      - name: Targeted parity tests
        run: bun test tests/chatgpt-web-continuation.test.ts tests/browser-worker-contract.test.ts
      - name: Root typecheck
        run: bunx tsc --noEmit
      - name: Full verification
        run: bun run verify
      - name: Commit verified patch
        shell: bash
        run: |
          rm .github/workflows/gauntlet-long-run.yml .github/workflows/gauntlet-long-run-2.yml
          git config user.name "David-T-Campos"
          git config user.email "132998405+David-T-Campos@users.noreply.github.com"
          git add src/adapters/chatgpt-web/browser-worker.ts src/adapters/chatgpt-web/continuation.ts tests/chatgpt-web-continuation.test.ts .github/workflows/gauntlet-long-run.yml .github/workflows/gauntlet-long-run-2.yml
          git commit -m "feat: continue long-running Web turns in place"
          git push origin parity/long-run-continuation
